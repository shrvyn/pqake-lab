name: Tamarin symbolic verification

# Tamarin 1.12 ships Linux and macOS binaries only, and this project's ProVerif
# models are run on Windows.  The phase-1 .spthy ports therefore need a Linux
# host: this job provides one, so that no Java, WSL or Docker install is needed
# on the machine the thesis was measured on.
#
#   gh run view <id> --repo shrvyn/pqake-lab            # verdicts
#   gh run download <id> --repo shrvyn/pqake-lab -n tamarin-logs

on:
  workflow_dispatch:
  push:
    paths:
      - 'model/**'
      - '.github/workflows/tamarin.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tamarin 1.12 and Maude
        run: |
          set -e
          mkdir -p ~/.local/bin
          curl -sSL -o tam.tar.gz \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          tar -xzf tam.tar.gz -C ~/.local/bin
          chmod a+x ~/.local/bin/tamarin-prover
          curl -sSL -o maude.zip \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          unzip -oj maude.zip -d ~/.local/bin/
          chmod a+x ~/.local/bin/maude
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tamarin-prover --version

      - name: Prove every model
        run: |
          mkdir -p model/logs
          for f in model/*.spthy; do
            name=$(basename "$f" .spthy)
            echo "===== $name"
            tamarin-prover --prove "$f" > "model/logs/$name.tamarin.log" 2>&1
            echo "exit $?"
            tail -30 "model/logs/$name.tamarin.log"
          done

      - name: Verdict table
        if: always()
        run: |
          {
            echo '| model | lemma | verdict |'
            echo '| --- | --- | --- |'
            for log in model/logs/*.tamarin.log; do
              awk -v m="$(basename "$log" .tamarin.log)" '
                /^lemma /     { lemma = $2 }
                /holds\.|cannot be proven|counter-example/ {
                  v = $0
                  gsub(/^ +| +$/, "", v)
                  printf "| %s | %s | %s |\n", m, lemma, v
                }' "$log"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamarin-logs
          path: model/logs/*.tamarin.log
